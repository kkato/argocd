apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:kkato/k8s
    targetRevision: main
    path: apps/recipe-api
  destination:
    server: https://kubernetes.default.svc
    namespace: recipe-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
