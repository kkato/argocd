apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gin-fleamarket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:kkato/k8s
    targetRevision: main
    path: apps/gin-fleamarket
  destination:
    server: https://kubernetes.default.svc
    namespace: gin-fleamarket
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
