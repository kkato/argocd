apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-go
  namespace: todo-app-go
  annotations:
    portfolio.kkato.app/title: "Todo App"
    portfolio.kkato.app/description: "GoとHTMXで作ったTodoアプリ"
    portfolio.kkato.app/github: "https://github.com/kkato/todo-app-go"
    portfolio.kkato.app/tech: "Go,HTMX,PostgreSQL"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: todo-app-go.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app-go
                port:
                  number: 80
