apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recipe-api
  namespace: recipe-api
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: recipe-api.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recipe-api
                port:
                  number: 80
