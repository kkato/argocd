apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recipe-api
  namespace: recipe-api
  annotations:
    portfolio.kkato.app/title: "Recipe API"
    portfolio.kkato.app/description: "GoとGinで作ったレシピ管理REST API"
    portfolio.kkato.app/github: "https://github.com/kkato/recipe-api"
    portfolio.kkato.app/tech: "Go,Gin,PostgreSQL"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: recipe-api.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recipe-api
                port:
                  number: 80
