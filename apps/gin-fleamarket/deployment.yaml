apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: gin-fleamarket
  name: gin-fleamarket
  namespace: gin-fleamarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gin-fleamarket
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: gin-fleamarket
    spec:
      containers:
      - image: ghcr.io/kkato/gin-fleamarket:latest
        name: gin-fleamarket
        volumeMounts:
        - name: dotenv
          mountPath: /app/.env
          subPath: .env
      volumes:
      - name: dotenv
        secret:
          secretName: dotenv
      imagePullSecrets:
      - name: ghcr
