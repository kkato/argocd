apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gin-fleamarket
  namespace: gin-fleamarket
  annotations:
    portfolio.kkato.app/title: "Gin Fleamarket"
    portfolio.kkato.app/description: "GoとGinで作ったフリマアプリAPI"
    portfolio.kkato.app/github: "https://github.com/kkato/gin-fleamarket"
    portfolio.kkato.app/tech: "Go,Gin,PostgreSQL"
    portfolio.kkato.app/commands: |
      curl https://gin-fleamarket.kkato.app/items
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: gin-fleamarket.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gin-fleamarket
                port:
                  number: 80
