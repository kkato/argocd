apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: book-api
  namespace: book-api
  annotations:
    portfolio.kkato.app/title: "Book API"
    portfolio.kkato.app/description: "GoとGinで作った書籍管理REST API"
    portfolio.kkato.app/github: "https://github.com/kkato/book-api"
    portfolio.kkato.app/tech: "Go,Gin,PostgreSQL"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: book-api.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: book-api
                port:
                  number: 80
