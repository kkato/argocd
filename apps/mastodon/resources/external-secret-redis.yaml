# Redis 認証パスワード。
# Vault に以下を事前に登録しておくこと:
#   vault kv put secret/mastodon/redis password=<password>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-redis-auth
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-redis-auth
  data:
    - secretKey: redis-password
      remoteRef:
        key: mastodon/redis
        property: password
