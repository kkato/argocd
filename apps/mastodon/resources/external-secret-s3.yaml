# Cloudflare R2 の S3 互換 API 認証情報。
# GCP Secret Manager に以下を事前に登録しておくこと:
#   mastodon-r2-access-key-id      : R2 の Access Key ID
#   mastodon-r2-secret-access-key  : R2 の Secret Access Key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-s3
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-s3
  data:
    - secretKey: access-key-id
      remoteRef:
        key: mastodon-r2-access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: mastodon-r2-secret-access-key
