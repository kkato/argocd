# Cloudflare R2 の S3 互換 API 認証情報。
# Vault に以下を事前に登録しておくこと:
#   vault kv put secret/mastodon/s3 \
#     access-key-id=<value> \      # R2 の Access Key ID
#     secret-access-key=<value>    # R2 の Secret Access Key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-s3
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-s3
  data:
    - secretKey: access-key-id
      remoteRef:
        key: mastodon/s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: mastodon/s3
        property: secret-access-key
