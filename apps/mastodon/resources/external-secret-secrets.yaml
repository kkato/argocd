# Mastodon アプリケーションのシークレット。
# GCP Secret Manager に以下を事前に登録しておくこと:
#   mastodon-secret-key-base    : `docker run --rm ghcr.io/mastodon/mastodon:v4.5.9 bin/rails secret`
#   mastodon-vapid-private-key  : bin/rails mastodon:webpush:generate_vapid_key の PRIVATE KEY
#   mastodon-vapid-public-key   : 同 PUBLIC KEY
#   mastodon-are-primary-key         : `bin/rails db:encryption:init` の primary_key
#   mastodon-are-deterministic-key   : 同 deterministic_key
#   mastodon-are-derivation-salt     : 同 key_derivation_salt
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-secrets
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-secrets
  data:
    - secretKey: secret-key-base
      remoteRef:
        key: mastodon-secret-key-base
    - secretKey: vapid-private-key
      remoteRef:
        key: mastodon-vapid-private-key
    - secretKey: vapid-public-key
      remoteRef:
        key: mastodon-vapid-public-key
    - secretKey: are-primary-key
      remoteRef:
        key: mastodon-are-primary-key
    - secretKey: are-deterministic-key
      remoteRef:
        key: mastodon-are-deterministic-key
    - secretKey: are-derivation-salt
      remoteRef:
        key: mastodon-are-derivation-salt
