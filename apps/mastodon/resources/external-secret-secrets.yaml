# Mastodon アプリケーションのシークレット。
# Vault に以下を事前に登録しておくこと:
#   vault kv put secret/mastodon/app \
#     secret-key-base=<value> \        # docker run --rm ghcr.io/mastodon/mastodon:v4.5.9 bin/rails secret
#     vapid-private-key=<value> \      # bin/rails mastodon:webpush:generate_vapid_key の PRIVATE KEY
#     vapid-public-key=<value> \       # 同 PUBLIC KEY
#     are-primary-key=<value> \        # bin/rails db:encryption:init の primary_key
#     are-deterministic-key=<value> \  # 同 deterministic_key
#     are-derivation-salt=<value>      # 同 key_derivation_salt
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-secrets
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-secrets
  data:
    - secretKey: secret-key-base
      remoteRef:
        key: mastodon/app
        property: secret-key-base
    - secretKey: vapid-private-key
      remoteRef:
        key: mastodon/app
        property: vapid-private-key
    - secretKey: vapid-public-key
      remoteRef:
        key: mastodon/app
        property: vapid-public-key
    - secretKey: are-primary-key
      remoteRef:
        key: mastodon/app
        property: are-primary-key
    - secretKey: are-deterministic-key
      remoteRef:
        key: mastodon/app
        property: are-deterministic-key
    - secretKey: are-derivation-salt
      remoteRef:
        key: mastodon/app
        property: are-derivation-salt
