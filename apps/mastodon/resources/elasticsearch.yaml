apiVersion: v1
kind: Service
metadata:
  name: mastodon-es-headless
  namespace: mastodon
spec:
  clusterIP: None
  selector:
    app: mastodon-es
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: mastodon-es
  namespace: mastodon
spec:
  selector:
    app: mastodon-es
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mastodon-es
  namespace: mastodon
  labels:
    app: mastodon-es
spec:
  serviceName: mastodon-es-headless
  replicas: 3
  selector:
    matchLabels:
      app: mastodon-es
  template:
    metadata:
      labels:
        app: mastodon-es
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mastodon-es
                topologyKey: kubernetes.io/hostname
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
          env:
            - name: cluster.name
              value: mastodon-es
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: "mastodon-es-0.mastodon-es-headless,mastodon-es-1.mastodon-es-headless,mastodon-es-2.mastodon-es-headless"
            - name: cluster.initial_master_nodes
              value: "mastodon-es-0,mastodon-es-1,mastodon-es-2"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: mastodon-es
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 10Gi
