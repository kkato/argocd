# CNPG Cluster の initdb とMastodonチャートの両方から参照される DB 認証情報。
# GCP Secret Manager に mastodon-db-password を事前に登録しておくこと。
# 参照: https://cloudnative-pg.io/documentation/current/bootstrap/#bootstrap-from-initdb
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-db
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mastodon-db
    template:
      type: kubernetes.io/basic-auth
      data:
        username: mastodon
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: mastodon-db-password
