apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-credentials
  namespace: cloudflare-tunnel-ingress-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-credentials
  data:
    - secretKey: api_token
      remoteRef:
        key: cloudflare
        property: api_token
    - secretKey: account_id
      remoteRef:
        key: cloudflare
        property: account_id
    - secretKey: tunnel_name
      remoteRef:
        key: cloudflare
        property: tunnel_name
