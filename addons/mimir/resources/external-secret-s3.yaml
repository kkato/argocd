# MinIO の S3 互換 API 認証情報 (Mimir 用)。
# MinIO bootstrap 後 (addons/minio/README 参照)、Vault に以下を事前に登録しておくこと:
#   vault kv put secret/minio/monitoring \
#     access-key=<value> \
#     secret-key=<value>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mimir-s3-credentials
  data:
    - secretKey: access-key
      remoteRef:
        key: minio/monitoring
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: minio/monitoring
        property: secret-key
