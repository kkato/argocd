# Grafana Mimir 単一バイナリ (-target=all) 構成。
# オブジェクトストレージは使わず、openebs-hostpath上のfilesystemバックエンド(chartデフォルト)で運用する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    # ホームクラスタの単一テナント運用のため multitenancy は無効化する。
    multitenancy_enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095

    # filesystemバックエンド(デフォルト)を使い、各ストレージ用に別ディレクトリを割り当てる。
    blocks_storage:
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    alertmanager_storage:
      filesystem:
        dir: /data/alertmanager

    ruler_storage:
      filesystem:
        dir: /data/ruler

    compactor:
      data_dir: /data/compactor
      compaction_interval: 30m

    # 単一replica運用のため、各リング(ingester/store-gateway/alertmanager)の
    # replication_factor はデフォルト(3)から1に下げる必要がある。
    ingester:
      ring:
        replication_factor: 1

    store_gateway:
      sharding_ring:
        replication_factor: 1

    alertmanager:
      sharding_ring:
        replication_factor: 1

    limits:
      compactor_blocks_retention_period: 90d
