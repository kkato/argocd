apiVersion: v1
kind: Secret
metadata:
  name: vault-unseal-keys
  namespace: vault
type: Opaque
stringData:
  key1: "5TQk/sSUIPsP7qcG/FJooX30yRG5ZM2gCckQ4r69Chmn"
  key2: "Y8ji8sIEk4BL03vsfoTjv/9spldrtI3Va3pQhKuLK3+f"
  key3: "m7v6391iQw3ZejDgf8EXDppBsPDcmuqNIi0pUPvv+MV8"
---
# vault-0/1/2 が sealed になったら自動で unseal するデーモン。
# 30 秒ごとに各 Pod のステータスを確認し、sealed なら 3 キーを順に投入する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-auto-unseal
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-auto-unseal
  template:
    metadata:
      labels:
        app: vault-auto-unseal
    spec:
      containers:
        - name: unseal
          image: hashicorp/vault:1.18.1
          command:
            - sh
            - -c
            - |
              while true; do
                for pod in vault-0 vault-1 vault-2; do
                  addr="http://${pod}.vault-internal:8200"
                  if vault status -address="$addr" 2>/dev/null | grep "^Sealed" | grep -q "true"; then
                    echo "$(date -u) ${pod} is sealed — unsealing..."
                    vault operator unseal -address="$addr" "$KEY1"
                    vault operator unseal -address="$addr" "$KEY2"
                    vault operator unseal -address="$addr" "$KEY3"
                    echo "$(date -u) ${pod} unseal complete"
                  fi
                done
                sleep 30
              done
          env:
            - name: KEY1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key1
            - name: KEY2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key2
            - name: KEY3
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
