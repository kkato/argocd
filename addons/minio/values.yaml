## MinIO custom values
##
## Loki / Mimir / Tempo が使う S3 互換オブジェクトストレージ。
## 単一ノード運用（openebs-hostpath はレプリケーションされないため distributed mode の恩恵が薄い）。

mode: standalone

# root クレデンシャルは External Secrets Operator 経由で Vault から注入する（addons/minio/resources 参照）。
existingSecret: minio-root-credentials

persistence:
  enabled: true
  storageClass: openebs-hostpath
  size: 100Gi

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

# Loki / Mimir / Tempo 用バケットを起動時に作成する。
buckets:
  - name: loki
    policy: none
    purge: false
  - name: mimir
    policy: none
    purge: false
  - name: tempo
    policy: none
    purge: false

# コンソール/APIとも外部公開しない（クラスタ内からのみアクセス）。
ingress:
  enabled: false

consoleIngress:
  enabled: false
