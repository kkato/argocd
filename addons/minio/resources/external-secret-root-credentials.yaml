# MinIO root クレデンシャル。
# Vault に以下を事前に登録しておくこと:
#   vault kv put secret/minio/root \
#     root-user=<value> \
#     root-password=<value>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: minio-root-credentials
  data:
    - secretKey: rootUser
      remoteRef:
        key: minio/root
        property: root-user
    - secretKey: rootPassword
      remoteRef:
        key: minio/root
        property: root-password
