## Loki custom values (SingleBinary / monolithic mode)
##
## オブジェクトストレージは使わず、openebs-hostpath上のfilesystemバックエンドで運用する。

deploymentMode: SingleBinary

# chart内蔵のminio依存は使わない。
minio:
  enabled: false

loki:
  # gateway(nginx)を無効化しデフォルトテナントの注入層が無いため、
  # 単一テナント運用として認証自体を無効化する。
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    retention_period: 720h # 30日

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 30Gi
    storageClass: openebs-hostpath

# SimpleScalableモード用ターゲット。SingleBinaryモードと併用不可のバリデーションがあるため明示的に0にする。
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# singleBinary が直接応答するため、前段のnginx gatewayは不要。
gateway:
  enabled: false
