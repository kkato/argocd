## Tempo custom values (monolithic mode)
##
## オブジェクトストレージは使わず、chartデフォルトのlocalバックエンド(openebs-hostpath)で運用する。
##
## OTLP受信(gRPC:4317, HTTP:4318)はchartのデフォルトで有効。Grafana Alloyからのトレース転送先として使う。

tempo:
  # トレースは容量に対して価値の減衰が早いため保持期間は短めにする。
  retention: 168h # 7日

  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

  # metrics-generatorを有効化する。無効のままだとTraceQLメトリクスクエリ(rate()等)が
  # 参照するリングにgeneratorが登録されず "empty ring" エラーになる。
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir.monitoring.svc.cluster.local:8080/api/v1/push"

  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks # TraceQLメトリクス(rate()等)のqueryRangeRecentに必須
          - span-metrics
          - service-graphs

persistence:
  enabled: true
  storageClassName: openebs-hostpath
  size: 10Gi
