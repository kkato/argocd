## Grafana Alloy custom values
##
## OpenTelemetryコレクタとして以下の3役割を担う:
##   - 全Podログを収集しLokiへpush
##   - OTLP(gRPC:4317/HTTP:4318)でアプリ計装のメトリクス/トレースを受信
##     - メトリクスはMimirへremote_write
##     - トレースはTempoへ転送
## k8sクラスタ標準メトリクス(node-exporter等)はkube-prometheus-stackのPrometheus経由の
## 既存経路を維持し、ここでは置き換えない。

controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // 全Podログを収集しLokiへ送信する。
      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // アプリ計装からのOTLP(メトリクス/トレース)を受信する。
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir.monitoring.svc.cluster.local:8080/api/v1/push"
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
